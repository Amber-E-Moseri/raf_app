name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Unit tests — SQLite in-memory, no secrets required
  # ──────────────────────────────────────────────────────────────
  unit:
    name: Unit tests (SQLite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          # SQLite mode — Postgres tests skip gracefully when POSTGRES_CONNECTION_STRING is absent
          PERSISTENCE_DRIVER: sqlite
          RAF_DB_PATH: ':memory:'
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          RAF_AUTH_REQUIRED: 'true'

  # ──────────────────────────────────────────────────────────────
  # Job 2: Postgres integration tests — requires repo secrets
  # Skipped automatically when secrets are not configured.
  # ──────────────────────────────────────────────────────────────
  postgres:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    # Only run when the privileged connection string secret is present
    if: ${{ vars.ENABLE_POSTGRES_CI == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run schema migrations
        run: node scripts/migrate.js
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}

      - name: Run Postgres integration tests
        run: npm test
        env:
          PERSISTENCE_DRIVER: postgres
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          POSTGRES_CONNECTION_STRING_APP: ${{ secrets.POSTGRES_CONNECTION_STRING_APP }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          RAF_AUTH_REQUIRED: 'true'

  # ──────────────────────────────────────────────────────────────
  # Job 3: RLS enforcement tests — proves raf_app role enforces RLS
  # Requires POSTGRES_CONNECTION_STRING (admin) and
  # POSTGRES_CONNECTION_STRING_APP (raf_app, NOBYPASSRLS).
  # ──────────────────────────────────────────────────────────────
  rls:
    name: RLS enforcement tests (raf_app)
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_POSTGRES_CI == 'true' }}
    needs: [postgres]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run RLS enforcement tests via raf_app role
        run: node --test tests/branchERlsEnforcement.test.js
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          POSTGRES_CONNECTION_STRING_APP: ${{ secrets.POSTGRES_CONNECTION_STRING_APP }}
          RAF_RUN_POSTGRES_RLS_TESTS: 'true'
          RAF_CONFIRM_NON_PRODUCTION_DB: 'true'

  # ──────────────────────────────────────────────────────────────
  # Lint — always runs
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
